<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUXIMONES — Royal Italian Dining</title>

<meta name="description" content="LUXIMONES — Where Italian Heritage Meets Royal Dining. A fantasy-inspired Italian dining experience.">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #080604;
  color: #f4ead3;
  overflow-x: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

section {
  position: relative;
  z-index: 2;
}

/* ---------- HERO ---------- */

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  background:
    radial-gradient(circle at 50% 35%, rgba(120,78,25,.28), transparent 32%),
    linear-gradient(to bottom, #080604 0%, #120b06 55%, #050302 100%);
  overflow: hidden;
}

.stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, #fff 1px, transparent 1px),
    radial-gradient(circle, #d9b56d 1px, transparent 1px);
  background-size: 120px 120px, 190px 190px;
  opacity: .35;
  animation: starsMove 20s linear infinite;
}

@keyframes starsMove {
  from { transform: translateY(0); }
  to { transform: translateY(120px); }
}

.moon {
  position: absolute;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: #f7e6b2;
  box-shadow:
    0 0 40px rgba(255,220,140,.45),
    0 0 120px rgba(255,180,70,.18);
  top: 9%;
  right: 8%;
  opacity: .8;
}

.palace {
  position: absolute;
  bottom: -30px;
  width: min(900px, 95vw);
  height: 430px;
  opacity: .85;
}

.palace-glow {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(
    ellipse,
    rgba(188,127,40,.2),
    transparent 65%
  );
}

.palace-top {
  position: absolute;
  top: 20px;
  left: 5%;
  right: 5%;
  height: 80px;
  border-top: 5px solid #9f7134;
  border-bottom: 3px solid #704a22;
  display: flex;
  justify-content: space-around;
  align-items: center;
  color: #d8ae62;
  font-size: 34px;
}

.columns {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 30px;
  height: 310px;
  display: flex;
  justify-content: space-between;
  align-items: end;
}

.column {
  width: 85px;
  height: 300px;
  background:
    linear-gradient(
      90deg,
      #3a2717,
      #b68b4d,
      #5a3a1e,
      #c49a58,
      #382313
    );
  border-radius: 8px 8px 3px 3px;
  box-shadow: 0 0 25px rgba(200,150,70,.12);
}

.column:before {
  content: "";
  display: block;
  height: 35px;
  margin-top: -25px;
  background: #a97b3e;
  border-radius: 5px;
}

.column:after {
  content: "";
  display: block;
  height: 25px;
  margin-top: 290px;
  background: #8e642e;
}

.entrance {
  width: 260px;
  height: 310px;
  background: #1a1008;
  border: 8px solid #8f6530;
  border-bottom: none;
  border-radius: 150px 150px 0 0;
  display: flex;
  align-items: end;
  justify-content: center;
  box-shadow:
    inset 0 0 60px #000,
    0 0 40px rgba(188,130,45,.2);
}

.door {
  width: 150px;
  height: 240px;
  background:
    linear-gradient(
      90deg,
      #130a04,
      #4c2b10,
      #1b0d05
    );
  border: 4px solid #a97935;
  border-bottom: none;
  border-radius: 90px 90px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 40px #000;
}

.door-text {
  color: #e5bd72;
  font-size: 16px;
  letter-spacing: 4px;
  transform: rotate(-90deg);
}

.hero-content {
  position: relative;
  z-index: 5;
  max-width: 800px;
  margin-bottom: 80px;
}

.eyebrow {
  color: #d6a957;
  letter-spacing: 5px;
  font-size: 12px;
  margin-bottom: 22px;
}

h1 {
  font-size: clamp(55px, 14vw, 125px);
  letter-spacing: 15px;
  color: #f3d48c;
  text-shadow:
    0 0 15px rgba(232,184,85,.35),
    0 4px 30px #000;
  margin-right: -15px;
}

.tagline {
  font-size: clamp(18px, 4vw, 28px);
  line-height: 1.5;
  color: #eadfc9;
  margin: 15px 0 35px;
}

button {
  border: 1px solid #b98a43;
  background: rgba(20,10,3,.8);
  color: #e7c47d;
  padding: 16px 32px;
  font-family: Georgia, serif;
  letter-spacing: 3px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  background: #b98a43;
  color: #120904;
  box-shadow: 0 0 35px rgba(214,169,87,.35);
}

.scroll {
  position: absolute;
  bottom: 25px;
  color: #9f8a69;
  font-size: 10px;
  letter-spacing: 3px;
}

.line {
  width: 1px;
  height: 50px;
  background: #b98a43;
  margin: 10px auto 0;
}

/* ---------- GENERAL ---------- */

.content-section {
  min-height: 90vh;
  padding: 110px 8%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background:
    linear-gradient(
      rgba(10,6,3,.9),
      rgba(10,6,3,.96)
    );
  border-top: 1px solid rgba(185,138,67,.15);
}

.content-inner {
  max-width: 1050px;
  margin: auto;
  width: 100%;
}

h2 {
  font-size: clamp(40px, 8vw, 78px);
  font-weight: normal;
  line-height: 1;
  margin-bottom: 30px;
}

h2 em {
  color: #c99a4c;
}

.large-text {
  max-width: 720px;
  color: #c8baa0;
  font-size: 18px;
  line-height: 1.9;
}

/* ---------- CARDS ---------- */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 50px;
}

.card {
  min-height: 230px;
  padding: 35px 25px;
  background:
    linear-gradient(
      145deg,
      rgba(82,52,24,.35),
      rgba(20,12,6,.8)
    );
  border: 1px solid rgba(191,145,70,.25);
  transition: .4s;
}

.card:hover {
  transform: translateY(-8px);
  border-color: #c79a4e;
}

.card-number {
  color: #b98a43;
  font-size: 13px;
  letter-spacing: 3px;
}

.card h3 {
  font-size: 25px;
  font-weight: normal;
  margin: 35px 0 15px;
}

.card p {
  color: #a99b84;
  line-height: 1.6;
}

/* ---------- MENU ---------- */

.menu-item {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 25px 0;
  border-bottom: 1px solid rgba(200,160,90,.18);
}

.menu-item h3 {
  font-size: 22px;
  font-weight: normal;
}

.menu-item p {
  color: #91836d;
  margin-top: 7px;
}

.price {
  color: #d3aa62;
  white-space: nowrap;
}

/* ---------- GALLERY ---------- */

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 45px;
}

.gallery div {
  height: 230px;
  background:
    linear-gradient(
      135deg,
      #3d2917,
      #9b7138,
      #201309
    );
  border: 1px solid rgba(220,175,90,.2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,220,150,.55);
  letter-spacing: 2px;
  transition: .4s;
}

.gallery div:nth-child(2) {
  background: linear-gradient(135deg,#20140a,#70502b,#160b05);
}

.gallery div:nth-child(3) {
  background: linear-gradient(135deg,#5b3d20,#171008,#936b34);
}

.gallery div:nth-child(4) {
  background: linear-gradient(135deg,#1d1208,#8d6330,#35200f);
}

.gallery div:nth-child(5) {
  background: linear-gradient(135deg,#79582d,#24170c,#b48743);
}

.gallery div:nth-child(6) {
  background: linear-gradient(135deg,#29170b,#65461f,#110805);
}

.gallery div:hover {
  transform: scale(1.02);
}

/* ---------- FOOTER ---------- */

.footer {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 80px 20px;
  background: #040201;
  border-top: 1px solid rgba(185,138,67,.2);
}

.footer h2 {
  font-size: 48px;
  color: #d9b56d;
}

.footer p {
  color: #81735e;
  margin: 15px 0 30px;
}

.copyright {
  font-size: 11px;
  letter-spacing: 2px;
  color: #574b3c;
}

/* ---------- MOBILE ---------- */

@media(max-width:700px) {
  .moon {
    width: 100px;
    height: 100px;
    right: 5%;
  }

  .palace {
    height: 300px;
  }

  .columns {
    height: 220px;
  }

  .column {
    width: 45px;
    height: 210px;
  }

  .entrance {
    width: 170px;
    height: 225px;
  }

  .door {
    width: 105px;
    height: 175px;
  }

  .
